name: release
# Tag a commit as vX.Y.Z (or run manually) to build and publish the images.
# Nothing is pushed from a laptop: this workflow is the only writer of the
# registry, and it refuses to publish unless checks and acceptance pass first.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/zts

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck nftables wireguard-tools dnsmasq jq
          sudo systemctl disable --now dnsmasq || true
          sudo curl -fsSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
      - run: scripts/run-checks.sh
      - name: version matches the tag
        if: github.ref_type == 'tag'
        run: test "v$(cat VERSION)" = "${{ github.ref_name }}" || { echo "VERSION $(cat VERSION) != tag ${{ github.ref_name }}"; exit 1; }
      - run: go build -o bin/zts ./cmd/zts
      - name: acceptance (bash essentials)
        run: sudo tests/acceptance/run.sh
      - name: acceptance (go core)
        run: sudo ZTS_BIN=./bin/zts tests/acceptance/run.sh
      - name: two minutes with a local build
        run: docker build -t zts:ci . && ZTS_PRESET=coding-agent ZTS_IMAGE=zts:ci scripts/two-minutes.sh

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image tags
        id: tags
        run: |
          v=$(cat VERSION)
          lower=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "image=$lower" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: go core (default image)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }}
            ${{ steps.tags.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: bash essentials
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.bash
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }}-bash
            ${{ steps.tags.outputs.image }}:bash
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
